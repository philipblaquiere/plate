<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>plate</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="brand" aria-label="plate">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3.5 3.5h13v13h-13z" />
            <path d="M3.5 16.5 16.5 3.5" class="brand-diag" />
          </svg>
          <span>plate</span>
        </div>
        <div class="status" id="status" data-state="idle" role="status" aria-live="polite"></div>
        <div class="seg" role="group" aria-label="Measurement system">
          <button data-system="metric" aria-pressed="true" title="Show lengths in metres">Metric</button>
          <button data-system="imperial" aria-pressed="false" title="Show lengths in feet and inches">
            Imperial
          </button>
        </div>
        <nav class="actions">
          <button class="btn" id="btn-new" title="Start a new plate">New</button>
          <button
            class="btn"
            id="btn-open"
            title="Add a .ncl file from your computer to the workspace (Ctrl+O)"
          >
            Open
          </button>
          <button class="btn" id="btn-save" title="Save (Ctrl+S). Shift-click to save all">Save</button>
          <div class="menu" id="export-menu">
            <button class="btn btn-primary" id="btn-export" aria-haspopup="menu" aria-expanded="false">
              Export
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" /></svg>
            </button>
            <div class="menu-list" role="menu" hidden>
              <button role="menuitem" data-format="dxf">
                <b>DXF</b><span>AutoCAD, Revit, ArchiCAD, Rhino</span>
              </button>
              <button role="menuitem" data-format="svg">
                <b>SVG</b><span>Vector drawing at 1:100</span>
              </button>
              <button role="menuitem" data-format="json"><b>JSON</b><span>Raw layout data</span></button>
            </div>
          </div>
        </nav>
      </header>

      <main class="split" id="split">
        <section class="pane pane-code" aria-label="Configuration">
          <div class="workbench">
            <nav class="activity" id="activity" aria-label="Side bar">
              <button
                class="activity-btn"
                data-view="files"
                title="Files (Ctrl+Shift+E). Ctrl+B hides the side bar"
                aria-label="Files"
                aria-pressed="true"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h4.5l1.5 1.5H14v8H2z" /></svg>
              </button>
              <button
                class="activity-btn"
                data-view="reference"
                title="Reference (Ctrl+Shift+H): what you can write, following the cursor"
                aria-label="Reference"
                aria-pressed="false"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    d="M8 4.2C6.8 3.3 5 3 2.5 3v9.5c2.5 0 4.3.3 5.5 1.2 1.2-.9 3-1.2 5.5-1.2V3C11 3 9.2 3.3 8 4.2z"
                  />
                  <path d="M8 4.2v9.5" />
                </svg>
              </button>
            </nav>
            <div class="sidebar" id="sidebar">
              <aside class="explorer" id="explorer" aria-label="Files">
                <div class="side-head">
                  <span class="explorer-root side-title"></span>
                  <button class="side-btn explorer-new" title="New file" aria-label="New file">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" /></svg>
                  </button>
                  <button class="side-btn explorer-new-folder" title="New folder" aria-label="New folder">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                      <path d="M2 4.5h4l1.3 1.5H14v6.5H2z" />
                      <path d="M8 7.6v3.4M6.3 9.3h3.4" />
                    </svg>
                  </button>
                </div>
                <div class="explorer-list" role="tree"></div>
              </aside>
              <aside class="reference" id="reference" aria-label="Reference" hidden></aside>
              <div
                class="sash"
                id="sidebar-sash"
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize the side bar"
                tabindex="0"
              ></div>
            </div>
            <div class="groups" id="groups"></div>
          </div>
          <div class="problems" id="problems" hidden></div>
        </section>

        <div
          class="gutter"
          id="gutter"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize panes"
          tabindex="0"
        ></div>

        <section class="pane pane-sheet" aria-label="Drawing">
          <div class="canvas" id="canvas"></div>

          <button class="sheet-file" id="sheet-file" title="The plate in the drawing" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 3h10v10H3z" />
              <path d="M3 13 13 3" class="sheet-file-diag" />
            </svg>
            <span id="sheet-file-name"></span>
            <svg class="sheet-file-caret" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M3 4.5 6 7.5 9 4.5" />
            </svg>
          </button>

          <div class="preview-bar" id="preview-bar" role="group" aria-label="Plan preview" hidden></div>

          <div class="tools" role="toolbar" aria-label="Drawing tools">
            <button class="tool" data-tool="select" title="Pan and inspect (V)" aria-pressed="true">
              <svg viewBox="0 0 20 20"><path d="M5 3v12.5l3.4-3.2 2.3 5 2-.9-2.3-5H15z" /></svg>
            </button>
            <button class="tool" data-tool="measure" title="Measure (M)" aria-pressed="false">
              <svg viewBox="0 0 20 20">
                <path d="M2.5 13.5 13.5 2.5l4 4-11 11z" />
                <path d="M6 10l1.6 1.6M8.5 7.5l1.6 1.6M11 5l1.6 1.6" />
              </svg>
            </button>
            <span class="tool-sep"></span>
            <button class="tool" data-action="fit" title="Fit drawing (F, or double-click)">
              <svg viewBox="0 0 20 20">
                <path d="M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5" />
                <path d="M7 7h6v6H7z" />
              </svg>
            </button>
            <button class="tool" data-action="zoom-in" title="Zoom in (+)">
              <svg viewBox="0 0 20 20">
                <circle cx="8.5" cy="8.5" r="5.5" />
                <path d="M12.5 12.5 17 17M6 8.5h5M8.5 6v5" />
              </svg>
            </button>
            <button class="tool" data-action="zoom-out" title="Zoom out (−)">
              <svg viewBox="0 0 20 20">
                <circle cx="8.5" cy="8.5" r="5.5" />
                <path d="M12.5 12.5 17 17M6 8.5h5" />
              </svg>
            </button>
            <span class="tool-sep"></span>
            <button class="tool" data-toggle="dims" title="Dimensions (D)" aria-pressed="true">
              <svg viewBox="0 0 20 20">
                <path d="M3 4v12M17 4v12M3 10h14M1.8 11.8l2.4-3.6M15.8 11.8l2.4-3.6" />
              </svg>
            </button>
            <button class="tool" data-toggle="grid" title="Grid (G)" aria-pressed="true">
              <svg viewBox="0 0 20 20"><path d="M3 3h14v14H3zM3 7.7h14M3 12.3h14M7.7 3v14M12.3 3v14" /></svg>
            </button>
          </div>

          <button class="stale" id="stale" hidden></button>

          <div
            class="verdict"
            id="verdict"
            data-status="perfect"
            role="status"
            aria-live="polite"
            hidden
          ></div>

          <div class="drawbar" id="drawbar" role="status" aria-live="polite" hidden>
            <span class="drawbar-mode" id="drawbar-mode"></span>
            <span class="drawbar-hint" id="drawbar-hint"></span>
            <button class="drawbar-btn" id="drawbar-undo" title="Remove the last point (Backspace)">
              Undo point
            </button>
            <button class="drawbar-btn drawbar-primary" id="drawbar-done" title="Finish (Enter)">
              Finish
            </button>
            <button class="drawbar-btn" id="drawbar-cancel" title="Cancel (Esc)">Cancel</button>
          </div>

          <aside class="titleblock" id="titleblock" hidden>
            <div class="tb-name"><span id="tb-name"></span><span class="tb-mode" id="tb-mode"></span></div>
            <dl class="tb-facts" id="tb-facts"></dl>
            <svg class="tb-bar" id="tb-bar" height="22"></svg>
          </aside>

          <div class="empty" id="empty" hidden></div>
        </section>
      </main>

      <footer class="statusbar">
        <span class="sb-cursor" id="sb-cursor">&nbsp;</span>
        <span class="sb-tool" id="sb-tool">Pan and inspect</span>
        <span class="sb-hint" id="sb-hint">Scroll to zoom, drag to pan, hover lines for dimensions</span>
        <span class="sb-engine" id="sb-engine"></span>
      </footer>
    </div>

    <div class="start" id="start" role="dialog" aria-modal="true" aria-labelledby="start-title" hidden>
      <div class="start-inner">
        <h1 class="start-title" id="start-title">Start a floor plate</h1>
        <p class="start-lede">
          Pick what you know first, then draw it on the sheet. The configuration is written for you, and you
          can keep shaping it by dragging points or editing the file.
        </p>
        <div class="start-modes">
          <button class="mode" data-mode="boundary">
            <svg class="mode-art" viewBox="0 0 200 120" aria-hidden="true">
              <path class="art-hatch" d="M30 96 L168 96 L168 52 L118 52 L118 22 L30 22 Z" />
              <path class="art-line" d="M30 96 L168 96 L168 52 L118 52 L118 22 L30 22 Z" />
              <g class="art-nodes">
                <rect x="27" y="93" width="6" height="6" />
                <rect x="165" y="93" width="6" height="6" />
                <rect x="165" y="49" width="6" height="6" />
                <rect x="115" y="49" width="6" height="6" />
                <rect x="115" y="19" width="6" height="6" />
                <rect x="27" y="19" width="6" height="6" />
              </g>
              <path class="art-dim" d="M30 108 H168 M30 104 V112 M168 104 V112" />
            </svg>
            <span class="mode-name">Boundary <kbd>1</kbd></span>
            <span class="mode-desc"
              >Draw the outline you have to work within. Everything is solved inside it.</span
            >
          </button>
          <button class="mode" data-mode="spine">
            <svg class="mode-art" viewBox="0 0 200 120" aria-hidden="true">
              <path class="art-zone" d="M22 86 L92 86 L156 34" />
              <path class="art-line art-spine" d="M22 86 L92 86 L156 34" />
              <g class="art-nodes">
                <circle cx="22" cy="86" r="3.5" />
                <circle cx="92" cy="86" r="3.5" />
                <circle cx="156" cy="34" r="3.5" />
              </g>
              <path class="art-dim" d="M22 100 H92 M22 96 V104 M92 96 V104" />
            </svg>
            <span class="mode-name">Spine <kbd>2</kbd></span>
            <span class="mode-desc"
              >Draw a line, like a corridor or a frontage. Everything is solved around it.</span
            >
          </button>
          <button class="mode" data-mode="free">
            <svg class="mode-art" viewBox="0 0 200 120" aria-hidden="true">
              <circle class="art-ring" cx="100" cy="60" r="9" />
              <path class="art-line" d="M78 60 H122 M100 38 V82" />
              <circle class="art-halo" cx="100" cy="60" r="34" />
            </svg>
            <span class="mode-name">Free <kbd>3</kbd></span>
            <span class="mode-desc"
              >Place an origin and nothing else. The solver starts from a single point.</span
            >
          </button>
        </div>
        <div class="start-foot">
          <div class="seg" role="group" aria-label="Units for the new plate">
            <button data-start-system="metric" aria-pressed="true">Metric</button>
            <button data-start-system="imperial" aria-pressed="false">Imperial</button>
          </div>
          <div class="start-actions">
            <button class="btn" id="start-open">Open from this computer…</button>
            <button class="btn btn-primary" id="start-continue" hidden>
              Continue with <span id="start-continue-name"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
